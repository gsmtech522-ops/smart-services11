<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Photo Maker — Print Suite</title>
<style>
:root {
  --accent: #2563eb;
  --accent-dark: #1e40af;
  --accent-light: #dbeafe;
  --success: #16a34a;
  --danger: #ef4444;
  --warning: #ca8a04;
  --cyan: #0891b2;
  --purple: #7c3aed;
  --bg: #f8fafc;
  --surface: #ffffff;
  --text: #0f172a;
  --text-light: #64748b;
  --border: #e2e8f0;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.10);
}
body.dark {
  --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9;
  --text-light: #94a3b8; --border: #334155;
}
body.dark .form-panel,
body.dark .preview-panel { background: var(--surface); }
body.dark input, body.dark textarea, body.dark select {
  background: #0f172a; color: var(--text); border-color: #475569;
}
body.dark fieldset { background: #0f172a; }
body.dark .photo-cell { background: #1e293b; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

/* ============ TOPBAR ============ */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 8px;
  position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar h1 { font-size: 17px; font-weight: 700; }
.back-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 7px 12px; border-radius: var(--radius);
  background: var(--bg); color: var(--text); text-decoration: none;
  font-size: 13px; font-weight: 500; border: 1px solid var(--border);
}
.back-btn:hover { background: var(--accent-light); color: var(--accent-dark); }
.topbar-actions { display: flex; gap: 6px; flex-wrap: wrap; }

button {
  padding: 8px 14px; border: none; border-radius: var(--radius);
  font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: inherit; display: inline-flex; align-items: center;
  gap: 5px; white-space: nowrap; transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-success { background: var(--success); color: white; }
.btn-success:hover { background: #15803d; }
.btn-gray { background: var(--text-light); color: white; }
.btn-gray:hover { background: #475569; }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-dark { background: #1e293b; color: white; border: 1px solid #334155; }
.btn-dark:hover { background: #0f172a; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ============ LAYOUT ============ */
.layout {
  display: grid; grid-template-columns: 1fr; gap: 16px;
  padding: 16px; max-width: 1600px; margin: 0 auto;
}
@media (min-width: 1100px) {
  .layout { grid-template-columns: 420px 1fr; }
}

/* ============ FORM PANEL ============ */
.form-panel {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px;
  max-height: calc(100vh - 100px); overflow-y: auto;
}
fieldset {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; margin-bottom: 14px; background: var(--surface);
}
legend {
  font-weight: 600; font-size: 12px; padding: 0 8px;
  color: var(--accent-dark); text-transform: uppercase; letter-spacing: 0.5px;
}
body.dark legend { color: var(--accent-light); }
label {
  display: block; font-size: 13px; font-weight: 500; margin-bottom: 10px;
}
input[type="text"], input[type="number"],
input[type="file"], select {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; font-family: inherit; margin-top: 4px;
  background: var(--surface); color: var(--text);
}
input:focus, select:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
}
input[type="file"] { padding: 6px; }
input[type="range"] {
  width: 100%; margin-top: 6px; accent-color: var(--accent);
}
input[type="color"] {
  width: 100%; height: 40px; padding: 2px;
  border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; margin-top: 4px;
}

.range-row {
  display: flex; justify-content: space-between;
  align-items: center; font-size: 12px;
  color: var(--text-light); margin-top: 2px;
}
.range-val {
  font-weight: 600; color: var(--accent-dark);
  background: var(--accent-light); padding: 1px 8px; border-radius: 10px;
  font-size: 11px;
}
body.dark .range-val { background: #1e3a8a; color: #dbeafe; }

/* Count buttons */
.count-buttons {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 6px; margin-top: 6px;
}
.count-btn {
  padding: 8px 4px; border: 2px solid var(--border);
  background: var(--surface); color: var(--text);
  border-radius: var(--radius); font-size: 13px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.count-btn:hover { border-color: var(--accent); }
.count-btn.active {
  background: var(--accent); color: white; border-color: var(--accent);
}

/* Color buttons */
.bg-colors {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
}
.bg-color-btn {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--border); cursor: pointer;
  transition: transform 0.2s;
}
.bg-color-btn:hover { transform: scale(1.15); }
.bg-color-btn.active { border-color: var(--accent); border-width: 3px; }

/* ============ PREVIEW ============ */
.preview-panel {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  display: flex; justify-content: center; align-items: flex-start;
  padding: 20px;
}

#sheet {
  background: white;
  position: relative;
  box-shadow: 0 0 20px rgba(0,0,0,0.15);
  box-sizing: border-box;
}
.sheet-inner {
  display: flex; flex-wrap: wrap;
  align-content: flex-start;
}

.photo-cell {
  position: relative;
  overflow: hidden;
  background: #f0f0f0;
  box-sizing: border-box;
}
.photo-cell img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.photo-cell.with-border {
  border: 1px dashed #999;
}
.cut-mark {
  position: absolute; background: #999;
  z-index: 5;
}

/* Empty state */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-light);
}
.empty-state-icon { font-size: 60px; margin-bottom: 12px; }

/* ============ TOAST ============ */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #1e293b; color: white; padding: 12px 20px;
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  font-size: 14px; z-index: 9999; opacity: 0;
  transform: translateY(20px); transition: all 0.3s;
  pointer-events: none; max-width: 300px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

/* ============ RESPONSIVE ============ */
@media (max-width: 1099px) {
  .form-panel { max-height: none; }
  .preview-panel { padding: 10px; overflow-x: auto; }
}
@media (max-width: 640px) {
  .topbar { padding: 8px 10px; }
  .topbar h1 { font-size: 14px; }
  .back-btn { padding: 5px 8px; font-size: 12px; }
  .topbar-actions { width: 100%; }
  .topbar-actions button { flex: 1; padding: 7px 4px; font-size: 11px; justify-content: center; }
  .layout { padding: 8px; gap: 10px; }
  .form-panel { padding: 10px; }
  .count-buttons { grid-template-columns: repeat(3, 1fr); }
}

/* ============ PRINT ============ */
@media print {
  @page { margin: 0; }
  body { background: white !important; }
  .topbar, .form-panel, .no-print { display: none !important; }
  .layout { display: block; padding: 0; gap: 0; }
  .preview-panel {
    padding: 0; box-shadow: none; border-radius: 0;
    display: block; overflow: visible; background: white !important;
    justify-content: flex-start;
  }
  #sheet {
    box-shadow: none !important;
    margin: 0 !important;
    page-break-inside: avoid;
    page-break-after: avoid;
  }
  #sheet * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
    color-adjust: exact !important;
  }
}

<body>

<div class="topbar no-print">
  <div class="topbar-left">
    <a href="./index.html" class="back-btn">← Back</a>
    <h1>📷 Passport Photo Maker</h1>
  </div>
  <div class="topbar-actions">
    <button class="btn-dark" id="btn-theme">🌙 Dark</button>
    <button class="btn-gray" id="btn-reset">↺ Reset</button>
    <button class="btn-primary" id="btn-print">🖨️ Print</button>
  </div>
</div>

<div class="layout">
  <div class="form-panel no-print">

    <fieldset>
      <legend>📷 Photo Upload</legend>
      <label>Select Photo
        <input type="file" id="photo-input" accept="image/*">
      </label>
    </fieldset>

    <fieldset>
      <legend>📐 Photo Size</legend>
      <label>Choose Standard Size
        <select id="size-select">
          <option value="35x45" data-w="35" data-h="45">35 × 45 mm — Passport (PK, UK, EU)</option>
          <option value="35x35" data-w="35" data-h="35">35 × 35 mm — Square</option>
          <option value="51x51" data-w="51" data-h="51">51 × 51 mm — US Passport / Visa</option>
          <option value="50x50" data-w="50" data-h="50">50 × 50 mm — Canada Passport</option>
          <option value="35x50" data-w="35" data-h="50">35 × 50 mm — Passport (India)</option>
          <option value="33x48" data-w="33" data-h="48">33 × 48 mm — Passport (China)</option>
          <option value="40x60" data-w="40" data-h="60">40 × 60 mm — Visa Photo</option>
          <option value="25x35" data-w="25" data-h="35">25 × 35 mm — Small Photo</option>
          <option value="30x40" data-w="30" data-h="40">30 × 40 mm — CNIC / ID Card</option>
          <option value="20x25" data-w="20" data-h="25">20 × 25 mm — Stamp Size</option>
          <option value="custom">— Custom Size —</option>
        </select>
      </label>
      <div id="custom-size-row" style="display:none;">
        <label>Width (mm)
          <input type="number" id="custom-w" value="35" min="10" max="200" step="1">
        </label>
        <label>Height (mm)
          <input type="number" id="custom-h" value="45" min="10" max="200" step="1">
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>📄 Paper / Sheet Size</legend>
      <label>Choose Paper
        <select id="paper-select">
          <option value="a4" data-w="210" data-h="297">A4 — 210 × 297 mm</option>
          <option value="a5" data-w="148" data-h="210">A5 — 148 × 210 mm</option>
          <option value="letter" data-w="216" data-h="279">Letter — 8.5 × 11 in</option>
          <option value="legal" data-w="216" data-h="356">Legal — 8.5 × 14 in</option>
          <option value="4x6" data-w="102" data-h="152">4 × 6 inch — 102 × 152 mm</option>
          <option value="5x7" data-w="127" data-h="178">5 × 7 inch — 127 × 178 mm</option>
        </select>
      </label>
      <label>Orientation
        <select id="orientation-select">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>🔢 Number of Photos</legend>
      <div class="count-buttons" id="count-buttons">
        <button type="button" class="count-btn" data-count="2">2</button>
        <button type="button" class="count-btn active" data-count="4">4</button>
        <button type="button" class="count-btn" data-count="6">6</button>
        <button type="button" class="count-btn" data-count="8">8</button>
        <button type="button" class="count-btn" data-count="12">12</button>
      </div>
      <label style="margin-top:10px;">Or enter manually
        <input type="number" id="count-manual" min="1" max="100" value="4">
      </label>
    </fieldset>

    <fieldset>
      <legend>📏 Spacing</legend>
      <label>Gap between photos
        <input type="range" id="gap-slider" min="0" max="15" value="3" step="0.5">
      </label>
      <div class="range-row">
        <span>0 mm</span>
        <span class="range-val" id="gap-val">3 mm</span>
        <span>15 mm</span>
      </div>
      <label style="margin-top:10px;">Sheet Margin
        <input type="range" id="margin-slider" min="0" max="20" value="5" step="1">
      </label>
      <div class="range-row">
        <span>0 mm</span>
        <span class="range-val" id="margin-val">5 mm</span>
        <span>20 mm</span>
      </div>
    </fieldset>

    <fieldset>
      <legend>🎨 Photo Adjustment</legend>
      <label>Brightness
        <input type="range" id="brightness-slider" min="50" max="150" value="100" step="1">
      </label>
      <div class="range-row">
        <span>50%</span>
        <span class="range-val" id="brightness-val">100%</span>
        <span>150%</span>
      </div>

      <label style="margin-top:10px;">Contrast
        <input type="range" id="contrast-slider" min="50" max="150" value="100" step="1">
      </label>
      <div class="range-row">
        <span>50%</span>
        <span class="range-val" id="contrast-val">100%</span>
        <span>150%</span>
      </div>

      <label style="margin-top:10px;">Saturation
        <input type="range" id="saturation-slider" min="0" max="200" value="100" step="1">
      </label>
      <div class="range-row">
        <span>0%</span>
        <span class="range-val" id="saturation-val">100%</span>
        <span>200%</span>
      </div>
    </fieldset>

    <fieldset>
      <legend>🖼️ Background Color</legend>
      <div class="bg-colors" id="bg-colors">
        <div class="bg-color-btn active" data-bg="#ffffff" style="background:#ffffff;border:2px solid #999"></div>
        <div class="bg-color-btn" data-bg="#f5f5f5" style="background:#f5f5f5;border:2px solid #999"></div>
        <div class="bg-color-btn" data-bg="#e0e7ff" style="background:#e0e7ff"></div>
        <div class="bg-color-btn" data-bg="#dbeafe" style="background:#dbeafe"></div>
        <div class="bg-color-btn" data-bg="#fee2e2" style="background:#fee2e2"></div>
        <div class="bg-color-btn" data-bg="#dcfce7" style="background:#dcfce7"></div>
        <div class="bg-color-btn" data-bg="#fef3c7" style="background:#fef3c7"></div>
        <div class="bg-color-btn" data-bg="#f3e8ff" style="background:#f3e8ff"></div>
      </div>
      <label style="margin-top:10px;">Custom Background
        <input type="color" id="bg-color-picker" value="#ffffff">
      </label>
    </fieldset>

    <fieldset>
      <legend>⚙️ Options</legend>
      <label>
        <input type="checkbox" id="show-border" style="width:auto;margin-right:6px;">Show dashed cut border
      </label>
      <label>
        <input type="checkbox" id="show-cutmarks" style="width:auto;margin-right:6px;">Show corner cut marks
      </label>
      <label>
        <input type="checkbox" id="auto-fit" checked style="width:auto;margin-right:6px;">Auto-fit to page
      </label>
    </fieldset>

  </div>

  <div class="preview-panel">
    <div id="sheet">
      <div class="sheet-inner" id="sheet-inner"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  "use strict";

  var App = {
    state: {
      photo: null,
      photoSize: { w: 35, h: 45 },
      paperSize: { w: 210, h: 297 },
      orientation: 'portrait',
      count: 4,
      gap: 3,
      margin: 5,
      brightness: 100,
      contrast: 100,
      saturation: 100,
      bgColor: '#ffffff',
      showBorder: false,
      showCutmarks: false,
      autoFit: true,
      theme: 'light'
    },

    init: function() {
      console.log("Passport Photo Maker starting...");

      this.bindPhoto();
      this.bindSize();
      this.bindPaper();
      this.bindOrientation();
      this.bindCount();
      this.bindGap();
      this.bindMargin();
      this.bindAdjustments();
      this.bindBg();
      this.bindOptions();
      this.bindTheme();
      this.bindActions();

      this.renderEmpty();
      console.log("Passport Photo Maker ready");
    },

    /* ============ PHOTO ============ */
    bindPhoto: function() {
      var self = this;
      document.getElementById('photo-input').addEventListener('change', function(e) {
        var f = e.target.files[0];
        if (!f) return;
        var r = new FileReader();
        r.onload = function(ev) {
          self.state.photo = ev.target.result;
          self.updateSheet();
        };
        r.readAsDataURL(f);
      });
    },

    /* ============ SIZE ============ */
    bindSize: function() {
      var self = this;
      var sel = document.getElementById('size-select');
      var customRow = document.getElementById('custom-size-row');
      var cw = document.getElementById('custom-w');
      var ch = document.getElementById('custom-h');

      sel.addEventListener('change', function() {
        if (sel.value === 'custom') {
          customRow.style.display = 'block';
          self.state.photoSize = { w: parseFloat(cw.value), h: parseFloat(ch.value) };
        } else {
          customRow.style.display = 'none';
          var opt = sel.options[sel.selectedIndex];
          self.state.photoSize = {
            w: parseFloat(opt.getAttribute('data-w')),
            h: parseFloat(opt.getAttribute('data-h'))
          };
        }
        self.updateSheet();
      });

      cw.addEventListener('input', function() {
        self.state.photoSize.w = parseFloat(cw.value) || 35;
        self.updateSheet();
      });
      ch.addEventListener('input', function() {
        self.state.photoSize.h = parseFloat(ch.value) || 45;
        self.updateSheet();
      });
    },

    /* ============ PAPER ============ */
    bindPaper: function() {
      var self = this;
      document.getElementById('paper-select').addEventListener('change', function() {
        var opt = this.options[this.selectedIndex];
        self.state.paperSize = {
          w: parseFloat(opt.getAttribute('data-w')),
          h: parseFloat(opt.getAttribute('data-h'))
        };
        self.updateSheet();
      });
    },

    bindOrientation: function() {
      var self = this;
      document.getElementById('orientation-select').addEventListener('change', function() {
        self.state.orientation = this.value;
        self.updateSheet();
      });
    },

    /* ============ COUNT ============ */
    bindCount: function() {
      var self = this;
      var btns = document.querySelectorAll('.count-btn');
      var manual = document.getElementById('count-manual');

      for (var i = 0; i < btns.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function() {
            for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
            btn.classList.add('active');
            self.state.count = parseInt(btn.getAttribute('data-count'));
            manual.value = self.state.count;
            self.updateSheet();
          });
        })(btns[i]);
      }

      manual.addEventListener('input', function() {
        var v = parseInt(manual.value) || 1;
        v = Math.max(1, Math.min(100, v));
        self.state.count = v;
        for (var j = 0; j < btns.length; j++) {
          btns[j].classList.toggle('active',
            parseInt(btns[j].getAttribute('data-count')) === v);
        }
        self.updateSheet();
      });
    },

    /* ============ GAP & MARGIN ============ */
    bindGap: function() {
      var self = this;
      var s = document.getElementById('gap-slider');
      var v = document.getElementById('gap-val');
      s.addEventListener('input', function() {
        self.state.gap = parseFloat(s.value);
        v.textContent = s.value + ' mm';
        self.updateSheet();
      });
    },

    bindMargin: function() {
      var self = this;
      var s = document.getElementById('margin-slider');
      var v = document.getElementById('margin-val');
      s.addEventListener('input', function() {
        self.state.margin = parseFloat(s.value);
        v.textContent = s.value + ' mm';
        self.updateSheet();
      });
    },

    /* ============ ADJUSTMENTS ============ */
    bindAdjustments: function() {
      var self = this;

      var b = document.getElementById('brightness-slider');
      var bv = document.getElementById('brightness-val');
      b.addEventListener('input', function() {
        self.state.brightness = parseInt(b.value);
        bv.textContent = b.value + '%';
        self.updateSheet();
      });

      var c = document.getElementById('contrast-slider');
      var cv = document.getElementById('contrast-val');
      c.addEventListener('input', function() {
        self.state.contrast = parseInt(c.value);
        cv.textContent = c.value + '%';
        self.updateSheet();
      });

      var s = document.getElementById('saturation-slider');
      var sv = document.getElementById('saturation-val');
      s.addEventListener('input', function() {
        self.state.saturation = parseInt(s.value);
        sv.textContent = s.value + '%';
        self.updateSheet();
      });
    },

    /* ============ BACKGROUND ============ */
    bindBg: function() {
      var self = this;
      var btns = document.querySelectorAll('.bg-color-btn');
      var picker = document.getElementById('bg-color-picker');

      for (var i = 0; i < btns.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function() {
            for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
            btn.classList.add('active');
            self.state.bgColor = btn.getAttribute('data-bg');
            picker.value = self.state.bgColor;
            self.updateSheet();
          });
        })(btns[i]);
      }

      picker.addEventListener('input', function() {
        self.state.bgColor = picker.value;
        for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
        self.updateSheet();
      });
    },

    /* ============ OPTIONS ============ */
    bindOptions: function() {
      var self = this;
      document.getElementById('show-border').addEventListener('change', function() {
        self.state.showBorder = this.checked;
        self.updateSheet();
      });
      document.getElementById('show-cutmarks').addEventListener('change', function() {
        self.state.showCutmarks = this.checked;
        self.updateSheet();
      });
      document.getElementById('auto-fit').addEventListener('change', function() {
        self.state.autoFit = this.checked;
        self.updateSheet();
      });
    },

    /* ============ THEME ============ */
    bindTheme: function() {
      var self = this;
      var btn = document.getElementById('btn-theme');
      btn.addEventListener('click', function() {
        if (self.state.theme === 'light') {
          self.state.theme = 'dark';
          document.body.classList.add('dark');
          btn.innerHTML = '☀️ Light';
        } else {
          self.state.theme = 'light';
          document.body.classList.remove('dark');
          btn.innerHTML = '🌙 Dark';
        }
      });
    },

    /* ============ ACTIONS ============ */
    bindActions: function() {
      var self = this;
      document.getElementById('btn-print').addEventListener('click', function() {
        window.print();
      });
      document.getElementById('btn-reset').addEventListener('click', function() {
        if (!confirm('Reset all settings?')) return;
        location.reload();
      });
    },

    /* ============ EMPTY STATE ============ */
    renderEmpty: function() {
      var inner = document.getElementById('sheet-inner');
      var sheet = document.getElementById('sheet');

      // A4 size in screen pixels (approx 96 DPI)
      var paperW = this.state.paperSize.w * 3.78;
      var paperH = this.state.paperSize.h * 3.78;

      sheet.style.width = paperW + 'px';
      sheet.style.height = paperH + 'px';
      sheet.style.background = '#ffffff';

      inner.innerHTML = '<div class="empty-state">' +
        '<div class="empty-state-icon">📷</div>' +
        '<h3>Upload a photo to begin</h3>' +
        '<p>Choose your photo and we will create a print-ready sheet</p>' +
        '</div>';
    },

    /* ============ BUILD SHEET ============ */
    updateSheet: function() {
      if (!this.state.photo) {
        this.renderEmpty();
        return;
      }

      var st = this.state;
      var sheet = document.getElementById('sheet');
      var inner = document.getElementById('sheet-inner');

      // Handle orientation
      var paperW = st.paperSize.w;
      var paperH = st.paperSize.h;
      if (st.orientation === 'landscape') {
        var tmp = paperW; paperW = paperH; paperH = tmp;
      }

      // Pixel conversion (1 mm ≈ 3.78 px at 96 DPI)
      var MM = 3.78;
      var sheetWpx = paperW * MM;
      var sheetHpx = paperH * MM;
      var marginPx = st.margin * MM;

      // Photo dimensions
      var photoWmm = st.photoSize.w;
      var photoHmm = st.photoSize.h;
      var gapMm = st.gap;

      // Available area (mm)
      var availW = paperW - (st.margin * 2);
      var availH = paperH - (st.margin * 2);

      // Calculate columns and rows
      var cols = Math.max(1, Math.floor((availW + gapMm) / (photoWmm + gapMm)));
      var rows = Math.max(1, Math.floor((availH + gapMm) / (photoHmm + gapMm)));
      var maxFit = cols * rows;

      // User wants count or auto-fit count
      var count = st.autoFit ? Math.min(st.count, maxFit) : st.count;

      // Filter string for CSS
      var filterStr = 'brightness(' + st.brightness + '%) ' +
                      'contrast(' + st.contrast + '%) ' +
                      'saturate(' + st.saturation + '%)';

      // Apply sheet size
      sheet.style.width = sheetWpx + 'px';
      sheet.style.height = sheetHpx + 'px';
      sheet.style.background = st.bgColor;

      // Apply inner padding
      inner.style.padding = marginPx + 'px';
      inner.style.width = '100%';
      inner.style.height = '100%';
      inner.style.boxSizing = 'border-box';
      inner.style.background = st.bgColor;
      inner.style.gap = (gapMm * MM) + 'px';
      inner.style.display = 'flex';
      inner.style.flexWrap = 'wrap';
      inner.style.alignContent = 'flex-start';
      inner.style.justifyContent = 'center';

      // Build cells
      var photoWpx = photoWmm * MM;
      var photoHpx = photoHmm * MM;
      var html = '';

      for (var i = 0; i < count; i++) {
        var cellClass = 'photo-cell' + (st.showBorder ? ' with-border' : '');
        var cutmarks = '';

        if (st.showCutmarks) {
          cutmarks =
            '<div class="cut-mark" style="top:0;left:0;width:8px;height:1px;"></div>' +
            '<div class="cut-mark" style="top:0;left:0;width:1px;height:8px;"></div>' +
            '<div class="cut-mark" style="top:0;right:0;width:8px;height:1px;"></div>' +
            '<div class="cut-mark" style="top:0;right:0;width:1px;height:8px;"></div>' +
            '<div class="cut-mark" style="bottom:0;left:0;width:8px;height:1px;"></div>' +
            '<div class="cut-mark" style="bottom:0;left:0;width:1px;height:8px;"></div>' +
            '<div class="cut-mark" style="bottom:0;right:0;width:8px;height:1px;"></div>' +
            '<div class="cut-mark" style="bottom:0;right:0;width:1px;height:8px;"></div>';
        }

        html += '<div class="' + cellClass + '" style="' +
          'width:' + photoWpx + 'px;' +
          'height:' + photoHpx + 'px;' +
          'background:' + st.bgColor + ';' +
          '-webkit-print-color-adjust:exact;' +
          'print-color-adjust:exact;' +
          '">' +
          cutmarks +
          '<img src="' + st.photo + '" style="filter:' + filterStr + ';">' +
          '</div>';
      }

      inner.innerHTML = html;
    },

    /* ============ TOAST ============ */
    toast: function(msg, type) {
      var t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = 'toast show ' + (type || '');
      clearTimeout(this._tt);
      this._tt = setTimeout(function() { t.classList.remove('show'); }, 2500);
    }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { App.init(); });
  } else {
    App.init();
  }
})();
</script>
</body>
</html>
